<!DOCTYPE html>
<html lang="en"> 
     <head>
     	  <meta charset="UTF-8">
     	     <meta name="viewport" content="width=device-width, initial-scale=1.0">

     	     <title>Lesotho Tourism - Contact</title>
     	        <link rel="stylesheet" href="style.css">
     	             <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     	        </head>

     	         <body>
     	         	<header>
     	         		<h1>Lesotho Tourism</h1>
     	         		  <nav><a href="index.html">Home</a>
     	         		  	    <a href="about.html">About</a>
     	         		  	       <a href="places.html">Places</a>
     	         		  	   <a href="gallery.html">Gallery</a>
     	         		  	         <a href="contact.html">Contact</a>
     	         		  	       </nav><button onclick="darkMode()">Dark / Light</button>
     	         		   </header><main><h2>Contact and Booking</h2>
     	         		  	     <p>Fill in this demo booking request. It will not be sent to a real office.</p>
     	         		  	   	       <form onsubmit="return sendBooking()">
     	         		  	   	   	    <label>Your name</label>
     	         		  	   	       	        <input id="visitorName" required>
     	         		  	   	       	           <label>Email address</label>
     	         		  	   	       	               <input id="visitorEmail" type="email" required>
     	         		  	   	       	              <label>Place to visit</label>
     	         		  	   	       	            <select id="place">
     	         		     	            	<option>Maletsunyane Falls</option>
     	         		  	   	       	           <option>Katse Dam</option>

     	         		  	   	       	       <option>Maloti Mountains</option>
     	         		  	   	       	  <option>Horse riding</option>
     	         		  	   	      </select><label>Number of people</label>
     	         		  	   	    <input id="people" type="number" min="1" value="1" required onchange="calculateCost()">
     	         		  	   	  <p>Estimated example cost: M<span id="cost">100</span></p>
     	         		  	   <label>Message</label>
     	         		  	<textarea rows="4"></textarea>
     	         		 <button type="submit">Send request</button>
     	         <p id="formMessage"></p>
     	               </form>
     	               <hr><h3>Registration form</h3>
     	             <form onsubmit="return registerVisitor()">

     	             	 <label>Full name</label><input id="regName" required>
     	             	 <label>Email</label><input id="regEmail" type="email" required>
     	           <label>Password</label>
     	                <input id="regPassword" type="password" minlength="4" required>
     	                        <button type="submit">Register</button>
     	                          <p id="regMessage"></p></form></main>
     	                        <footer><p>Visit the beautiful Kingdom of Lesotho</p>
     	                        	<p>Bohlokoa Taaso 901015693</p>
     	                        </footer><script src="script.js">
     	                        	
     	                    </script>
     	                </body>
     	            </html>
